# 컴파일과 검사. PR 마다 돈다.
#
# ## 갈래가 없다
#
# 코어는 npm 에 `borch-ts` 로 있고, **대조에 쓰는 벤치까지 그 배포에 실려 있다**
# (0.1.1 부터). 그래서 `npm ci` 한 번이면 검사 전부가 토큰 없이 돈다.
#
# 전에는 갈래가 있었다. 벤치가 배포에 없어서 옆 저장소를 받아야 했고, 그 저장소가
# private 이라 토큰이 필요했으며, **그 토큰은 어디에도 설정된 적이 없었다** — 그래서
# 대조 검사는 한 번도 안 돌고 매번 초록불이었다. 그것을 로그에서 보고 알았고,
# 고친 방향은 토큰을 만드는 쪽이 아니라 **코어가 벤치를 싣는 쪽**이었다.
# 검사가 없는 것과 있는데 안 도는 것은 초록색이 같다.
name: 검사

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
