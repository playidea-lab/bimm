<!doctype html>
<!--
  timm 이 낸 수와 여기 옮긴 것이 낸 수를 **같은 자리에 놓기 위한 페이지.**

  파이썬 쪽(`parity.py`)이 timm 모델을 세워 가중치·입력·기대 출력을 safetensors
  하나에 담아 두면, 이 페이지가 그것으로 bimm 모델을 세워 같은 입력을 통과시킨다.
  대조는 파이썬이 한다 — 여기서 판정까지 하면 검사가 자기 답안을 채점하게 된다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>bimm — timm 과 같은 수인가</title>
  <style>body { font: 14px/1.6 ui-monospace, Menlo, monospace; margin: 2rem; }</style>
</head>
<body>
<pre id="out">재료를 받는 중…</pre>
<script type="importmap">
{
  "imports": {
    "borch-ts": "/node_modules/borch-ts/borch-ts/dist/src/index.js",
    "bimm-ts": "/dist/src/index.js"
  }
}
</script>
<script type="module">
  import { Device, currentDevice, decode, init } from "borch-ts";
  import { createModel } from "bimm-ts";

  const out = document.getElementById("out");
  try {
    await init();

    // 두 가지를 본다. 기본은 **아키텍처가 같은가**(parity.py 가 담은 재료 한 덩이),
    // `?cargo=1` 은 **화물이 실리는가**(레지스트리에 올릴 파일 그대로).
    // `?cargo=<모델 이름>` — 화물이 모델마다 자기 자리에 있으므로 어느 것인지 말한다.
    // 옛 `?cargo=1` 은 자리가 하나였을 때의 형태다.
    const asked = new URLSearchParams(location.search).get("cargo");
    const cargo = asked !== null;
    const where = asked === "1" ? "/out/cargo" : `/out/cargo/${asked}`;

    const grab = async (path) => {
      const res = await fetch(path);
      if (!res.ok) throw new Error(`못 받았다: ${path} — ${res.status}`);
      return decode(new Uint8Array(await res.arrayBuffer()));
    };

    let input, want, given, spec, strict;
    if (cargo) {
      // 화물은 세 파일로 나뉘어 있고, **strict 로 싣는다** — 허브의 로더가 그렇게
      // 부르기 때문이다. 열쇠가 하나라도 남거나 모자라면 여기서 멈춘다.
      const summary = await (await fetch(`${where}/summary.json`)).json();
      given = (await grab(`${where}/model.safetensors`)).tensors;
      input = (await grab(`${where}/sample.in.safetensors`)).tensors["input"];
      want = (await grab(`${where}/sample.out.safetensors`)).tensors["output"];
      spec = { library: "timm", factory: summary.source.model,
               numClasses: summary.numClasses };
      strict = true;
    } else {
      const { tensors, metadata } = await grab("/out/parity.safetensors");
      // `__` 로 시작하는 둘은 가중치가 아니라 시험 재료다.
      input = tensors["__input"];
      want = tensors["__output"];
      given = {};
      for (const [name, t] of Object.entries(tensors)) {
        if (!name.startsWith("__")) given[name] = t;
      }
      spec = { library: metadata.library, factory: metadata.factory,
               numClasses: Number(metadata.numClasses) };
      strict = false;
    }

    const model = createModel(spec.library, spec.factory, {
      numClasses: Number(spec.numClasses),
    });

    // **eval 이 먼저다.** BatchNorm 이 training 이면 배치 통계로 정규화하고, 그러면
    // 실린 running_mean·running_var 가 안 쓰인다 — 예외 없이 조용히 다른 수가 난다.
    model.eval();

    // 재료 모드가 strict 가 아닌 것은 `num_batches_tracked` 를 안 실었기 때문이다.
    // 화물 모드는 그것까지 들어 있어야 하므로 strict 로 부른다 — 허브와 같은 부름이다.
    model.loadStateDict(given, strict);

    const got = model.forward(input);

    // **디바이스를 잃었는지 묻는다.** 잃으면 그 뒤의 수는 전부 뜻이 없는데 예외가
    // 안 난다 — 코어가 그래서 이것을 물어볼 수 있는 상태로 두었고(`device.ts`),
    // 그 자리를 안 쓰면 여기서는 "매달렸다" 로만 보인다(실측: efficientnet_b1).
    const device = currentDevice();
    if (!device.alive) {
      window.__parity = {
        error: `디바이스를 잃었다: ${JSON.stringify(device.lost)}`,
        adapter: Device.adapterInfo,
      };
      out.textContent = "디바이스를 잃었다";
      throw new Error("device lost");
    }

    window.__parity = {
      adapter: Device.adapterInfo,
      // 무엇을 어떻게 실었는지. 화물 모드의 strict 는 이 검사의 요점이므로 말한다.
      mode: cargo ? "cargo" : "material",
      strict,
      loaded: Object.keys(given).length,
      // 실은 열쇠와 모델이 부르는 열쇠. 둘이 갈리면 가중치가 조용히 덜 실린다.
      wanted: Object.keys(model.stateDict()).sort(),
      given: Object.keys(given).sort(),
      shape: got.shape,
      got: Array.from(await got.toArray()),
      want: Array.from(await want.toArray()),
    };
    out.textContent = `났다 — ${got.shape.join("×")}`;
  } catch (err) {
    let lost = null;
    try { const d = currentDevice(); lost = d.alive ? null : d.lost; } catch { /* 코어가 서기도 전이면 물을 것이 없다 */ }
    window.__parity = {
      error: String((err && err.stack) || err),
      ...(lost === null ? {} : { deviceLost: lost }),
    };
    out.textContent = `안 됐다: ${err}`;
  }
</script>
</body>
</html>
